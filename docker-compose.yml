services:
  app:
    # Both on purpose: `docker compose pull` fetches the image CI built, while
    # `docker compose up -d --build` still works on a box with no registry access.
    image: ghcr.io/ritik3236/cloud-vpn:latest
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/install.sh", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
